name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lint and test tools
        run: python -m pip install --upgrade pip pytest ruff
      - name: Lint with ruff
        run: ruff check .
      - name: Run pure-Python geometry tests
        run: pytest -v tests/test_car_geometry.py

  blender-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system libraries required by headless bpy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libxi6 libxrender1 libxfixes3 libxxf86vm1 libxkbcommon0 libsm6 libice6
      - name: Install Blender 4.2 Python module (bpy) and pytest
        run: python -m pip install --upgrade pip "bpy==4.2.*" pytest
      - name: Run full Blender 4.2 build, QA, animation, and UE FBX export tests
        run: pytest -v tests/test_blender_pipeline.py
